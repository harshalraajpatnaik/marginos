spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:marginos}
    username: ${POSTGRES_USER:marginos}
    password: ${POSTGRES_PASSWORD:marginos_secure_password_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
